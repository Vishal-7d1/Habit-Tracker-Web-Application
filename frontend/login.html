<!DOCTYPE html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — HabitForge Habit Tracker</title>
    <meta name="description" content="Sign in to HabitForge to continue your study plan, daily habits and streaks." />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card">
        <a class="auth-brand" href="index.html">
          <span class="brand-mark"><i class="fa-solid fa-crown" aria-hidden="true"></i></span>
          <span class="brand-text">HabitForge</span>
        </a>
        <h1>Welcome Back</h1>
        <p class="auth-lead">Sign in to continue today's study plan and habits.</p>

        <form id="loginForm" novalidate>
          <div class="auth-field">
            <label class="form-label" for="loginEmail">Email address</label>
            <input class="form-control" type="email" id="loginEmail" name="email" autocomplete="email" placeholder="you@college.edu" />
            <p class="field-error" id="loginEmailError" role="alert"></p>
          </div>

          <div class="auth-field">
            <label class="form-label" for="loginPassword">Password</label>
            <div class="password-wrap">
              <input class="form-control" type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Enter your password" />
              <button class="toggle-password" type="button" data-target="loginPassword" aria-label="Show password">
                <i class="fa-solid fa-eye" aria-hidden="true"></i>
              </button>
            </div>
            <p class="field-error" id="loginPasswordError" role="alert"></p>
          </div>

          <div class="auth-options">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="rememberMe" />
              <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
            <a href="#" id="forgotPassword">Forgot password?</a>
          </div>

          <button class="btn btn-gold w-100" type="submit">Login</button>
        </form>

        <p class="auth-footer">Don't have an account? <a href="register.html">Create one</a></p>
        <a class="auth-back" href="index.html"><i class="fa-solid fa-arrow-left me-1" aria-hidden="true"></i>Back to home</a>
      </section>
    </main>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/api/api.js"></script>
    <script src="js/api/authApi.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
